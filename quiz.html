/* Layout: app shell that fills the screen. Top bar + scrolling content + sticky bottom actions (thumb reach on phones). */
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#111827; --muted:#5b6477; --line:#e2e6ee; --soft:#eef1f7;
  --accent:#3a4ee0; --accent-soft:#e8ebff; --accent-ink:#ffffff;
  --ok:#11924a; --ok-soft:#e2f6ea; --bad:#d93a3f; --bad-soft:#fde9ea;
  --shadow:0 1px 2px rgba(17,24,39,.06),0 4px 14px rgba(17,24,39,.05);
  --f-ui:"PLEX","ATK",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-en:"ATK","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f19; --card:#141a29; --ink:#e8ecf5; --muted:#9aa3b8; --line:#252d41; --soft:#1b2234;
  --accent:#8794ff; --accent-soft:#232a52; --accent-ink:#0b0f19;
  --ok:#3fd083; --ok-soft:#11301f; --bad:#ff7d80; --bad-soft:#3b1a1d;
  --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.en{font-family:var(--f-en)}
#app{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.bar h1{font-size:1.15rem;margin:0;font-weight:700;line-height:1.3}
.bar .sub{font-size:.8rem;color:var(--muted)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:scale(.96)}
.save{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.qprog{height:4px;background:var(--soft)}
.qprog span{display:block;height:100%;background:var(--accent);transition:width .25s}

main{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:16px 24px}

/* ---------- home ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.hero h2{margin:0;font-size:1.05rem;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.5rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
.track{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.track .g{background:var(--ok)} .track .r{background:var(--bad)}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;padding:0 16px}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sect h3{margin:0;font-size:1rem}
.sect span{font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.tile .top{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.tile .n{font-size:1.6rem;font-weight:700;line-height:1;color:var(--accent)}
.tile .lbl{font-size:.75rem;color:var(--muted)}
.tile .meta{font-size:.78rem;color:var(--muted)}
.tile .badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tile .badge.done{background:var(--ok-soft);color:var(--ok)}
.tile .track{height:5px}
@media (hover:hover){.tile:hover,.btn:hover:not([disabled]),.icon-btn:hover{border-color:var(--accent)}}

/* ---------- quiz ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;scroll-snap-type:x proximity}
.strip button{flex:none;min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-en);font-size:.82rem;scroll-snap-align:center}
.strip button[data-st="ok"]{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}
.strip button[data-st="bad"]{background:var(--bad-soft);border-color:transparent;color:var(--bad);font-weight:700}
.strip button[aria-current="true"]{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.src{font-size:.8rem;color:var(--muted)}
.stem{font-family:var(--f-en);font-size:1.15rem;line-height:1.7;direction:ltr;text-align:left;overflow-wrap:anywhere}
.stem u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;direction:ltr}
.opt{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-family:var(--f-en);font-size:1.05rem;line-height:1.45}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .tag{flex:none;font-family:var(--f-ui);font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.opt:not([disabled]):active{transform:scale(.99);border-color:var(--accent)}
@media (hover:hover){.opt:not([disabled]):hover{border-color:var(--accent)}}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff} .opt.ok .tag{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff} .opt.bad .tag{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict svg{width:22px;height:22px;flex:none}
.exp{background:var(--accent-soft);border-radius:14px;padding:12px 14px;line-height:1.85}
.exp b{color:var(--accent)}
.result{display:flex;flex-direction:column;gap:12px}
.again{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:4px;min-height:40px}
.keys{display:none;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.keys kbd{font-family:var(--f-en);font-size:.75rem;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;margin-inline:2px;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.keys{display:flex}}
.swipe{font-size:.78rem;color:var(--muted);text-align:center}
@media (hover:hover) and (pointer:fine){.swipe{display:none}}
.dock{position:sticky;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm .row{display:flex;gap:8px}
.confirm .btn{flex:1}
.reset{align-self:center;background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:4px;min-height:40px}
.summary{text-align:center;align-items:center}
.summary .big{font-size:2.6rem;font-weight:700;line-height:1.1;font-family:var(--f-en)}
.summary .acts{display:flex;flex-direction:column;gap:10px;width:100%}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stem{font-size:1.08rem}
  .card,.hero{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

,"could","might","should"],"a":2,"e":"<span class=\"en\">might<\/span> للاحتمال: ربما يحب أكل صيني اليوم."},{"k":11412,"s":"Ali…………...work and at present he is having a cup of coffee with his friends.","o":["just getting off","has just got off","is just got off","just gets off"],"a":1,"e":"<span class=\"en\">just<\/span> + المضارع التام لحدث انتهى للتو: <span class=\"en\">has just got off work<\/span>."},{"k":11418,"s":"I have no idea where…………………………","o":["is the doctor’s office","is the office doctor’s","the office doctor’s is","the doctor’s office is"],"a":3,"e":"سؤال غير مباشر بعد <span class=\"en\">no idea where<\/span>، فالترتيب كجملة خبرية: <span class=\"en\">the doctor's office is<\/span>."},{"k":11424,"s":"My employers said they…………………hotel accommodation, but when I arrived, they didn’t.","o":["provide","providing","has provided","would provide"],"a":3,"e":"كلام منقول (<span class=\"en\">said<\/span>) عن المستقبل، فنحول <span class=\"en\">will<\/span> إلى <span class=\"en\">would<\/span>‏: <span class=\"en\">would provide<\/span>."},{"k":11430,"s":"If the storm……………., they would have been able to travel.","o":["ended","will end","had ended","ends"],"a":2,"e":"الجواب <span class=\"en\">would have been able<\/span> يعني شرطًا من النوع الثالث، فنستخدم <span class=\"en\">had ended<\/span>."},{"k":11439,"s":"Which one of the underlined words or phrases is INCORRECT?<br><u>Tomorrow<\/u> we are going <u>to review<\/u> some of the things we <u>discuss<\/u> in our <u>last <\/u>meeting.","o":["Tomorrow","to review","discuss","last"],"a":2,"e":"<span class=\"en\">in our last meeting<\/span> تدل على الماضي، فالصحيح <span class=\"en\">discussed<\/span> وليس <span class=\"en\">discuss<\/span>."},{"k":11451,"s":"Choose the CORRECT ORDER to make the following sentence into a paragraph:<br>(1) Then, pour it into a cup with a teabag and wait a couple of minutes.<br>(2) Now, you can remove the teabag and drink it.<br>(3) First, you heat the water.<br>(4) Making a cup of tea i hich sentence is all PUNCTUATION correct?","o":["There are many things you need to succeed in the business world, it helps to have a good plan, starting money and support of family.","There are many things you need to succeed in the business world. It helps to have a good plan, starting money and support of family.","There are many things you need to succeed in the business world. It helps to have a good plan starting money and support of family.","There are many things you need to succeed in the business world: it helps to have a good plan, starting money and support of family."],"a":1,"e":"نقطة بين الجملتين المستقلتين، وفواصل بين عناصر القائمة (<span class=\"en\">a good plan<\/span>, <span class=\"en\">starting money and<\/span> ...)."},{"k":11595,"s":"Choose the CORRECT ORDER to make the following sentences into a paragraph:<br>1) Thomas Edison made it in 1879.<br>2) At that time, people laughed at it and didn’t think it would be popular.<br>3) Some new products are so common we can’t imagine life without them.<br>4) However, they were not always thought of as a good idea.<br>5) For example, let’s look at the light bulb.","o":["(5), (3), (1), (2), (4)","(1), (2), (4), (5), (3)","(3), (4), (5), (1), (2)","(2), (1), (5), (4), (3)"],"a":2,"e":"نبدأ بالفكرة العامة (3)، ثم <span class=\"en\">However<\/span> (4)، ثم <span class=\"en\">For example<\/span> (5)، ثم إديسون صنعه (1)، ثم ضحك الناس (2)."},{"k":11601,"s":"40 In which sentence is all PUNCTUTION correct?","o":["When he saw the huge discounts available Mark decided to buy a new laptop it made work so much easier.","When he saw the huge discounts available, Mark decided to buy a new laptop it made work so much easier.","When he saw the huge discounts available Mark decided to buy a new laptop. It made work so much easier.","When he saw the huge discounts available, Mark decided to buy a new laptop. It made work so much easier."],"a":3,"e":"فاصلة بعد الجملة الظرفية في البداية (<span class=\"en\">When he saw<\/span> ... <span class=\"en\">available<\/span>,)، ونقطة بين الجملتين المستقلتين."}]}]</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
const MODELS = DATA.map(m => ({n:m.n, q:m.q.map(q => Object.assign({n:m.n}, q))}));
const BYN = {}; MODELS.forEach(m => BYN[m.n] = m);
const TOTAL = MODELS.reduce((s,m) => s + m.q.length, 0);
const ad = v => String(v);
const LET = ['A','B','C','D','E'];
const app = document.getElementById('app');
const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>'
};

/* ---------- state (saved in this browser) ---------- */
const S = {ans:{}, pos:{}, t:{}};
const LS = 'step-grammar-quiz-v1';
try{ const v = JSON.parse(localStorage.getItem(LS) || 'null'); if(v && v.ans){ S.ans = v.ans; S.pos = v.pos || {}; S.t = v.t || {}; } }catch(e){}
let canSave = true;
function save(n){ if(n != null) S.t[n] = Date.now(); try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){ canSave = false; } }
const getAns = q => { const a = S.ans[q.n]; return a && a[q.k] != null ? a[q.k] : null; };
function stats(list){ let done=0, ok=0; for(const q of list){ const a = getAns(q); if(a != null){ done++; if(a === q.a) ok++; } } return {total:list.length, done, ok, bad:done-ok}; }
const allQ = () => MODELS.flatMap(m => m.q);
const mistakes = list => (list || allQ()).filter(q => { const a = getAns(q); return a != null && a !== q.a; });
const track = s => `<div class="track"><span class="g" style="width:${s.total ? s.ok/s.total*100 : 0}%"></span><span class="r" style="width:${s.total ? s.bad/s.total*100 : 0}%"></span></div>`;
const saveTag = () => `<span class="save" title="${canSave ? 'تقدّمك ينحفظ تلقائيًا في هذا المتصفح' : 'المتصفح ما يسمح بالحفظ (مثلًا التصفح الخفي)'}"><i style="${canSave ? '' : 'background:var(--bad)'}"></i>${canSave ? 'محفوظ تلقائيًا' : 'الحفظ متوقف'}</span>`;

let view = {name:'home'};

/* ---------- home ---------- */
function renderHome(){
  const s = stats(allQ()), mis = mistakes().length;
  const pct = s.done ? Math.round(s.ok / s.done * 100) : null;
  let last = null; Object.keys(S.t).forEach(k => { if(BYN[k] && (last == null || S.t[k] > S.t[last])) last = +k; });
  const tiles = MODELS.map(m => {
    const t = stats(m.q), done = t.done === t.total;
    const badge = done ? `<span class="badge done">${ad(t.ok)}/${ad(t.total)}</span>` : (t.done ? `<span class="badge">${ad(t.done)}/${ad(t.total)}</span>` : '');
    return `<button class="tile" data-act="open" data-n="${m.n}" aria-label="النموذج ${m.n}">
      <span class="top"><span><span class="lbl">النموذج</span> <span class="n num">${ad(m.n)}</span></span>${badge}</span>
      ${track(t)}
      <span class="meta num">${t.done ? `${ad(t.ok)} صح · ${ad(t.bad)} خطأ` : `${ad(t.total)} سؤال`}</span></button>`;
  }).join('');
  app.innerHTML = `
  <header class="bar"><div class="bar-in wrap">
    <div><h1>كويز قرامر <span class="en" style="color:var(--accent)">STEP</span></h1><div class="sub">٤٤ نموذج · ${ad(TOTAL)} سؤال مع الشرح</div></div>
    ${saveTag()}</div></header>
  <main class="wrap">
    <section class="hero">
      <h2>تقدّمك</h2>
      <div class="stats">
        <div class="stat"><b class="num">${ad(s.done)}</b><span>مجاوَب من ${ad(TOTAL)}</span></div>
        <div class="stat"><b class="num" style="color:var(--ok)">${ad(s.ok)}</b><span>صح</span></div>
        <div class="stat"><b class="num">${pct == null ? '—' : pct + '%'}</b><span>نسبة الصح</span></div>
      </div>
      ${track({total:TOTAL, ok:s.ok, bad:s.bad})}
      <div class="cta">
        ${last != null ? `<button class="btn primary" data-act="resume" data-n="${last}">أكمل النموذج ${ad(last)}</button>` : `<button class="btn primary" data-act="open" data-n="1">ابدأ النموذج ١</button>`}
        <button class="btn" data-act="review" ${mis ? '' : 'disabled'}>راجع أخطائي${mis ? ` (${ad(mis)})` : ''}</button>
      </div>
    </section>
    <div class="sect"><h3>النماذج</h3><span>اختر نموذج وابدأ</span></div>
    <div class="grid">${tiles}</div>
  </main>`;
}

/* ---------- quiz ---------- */
const cur = () => view.list[view.i];
function renderQuiz(){
  const L = view.list, total = L.length;
  if(view.i >= total) return renderSummary();
  const q = cur(), a = getAns(q), answered = a != null;
  const title = view.kind === 'model' ? `النموذج ${ad(view.n)}` : 'مراجعة الأخطاء';
  const st = stats(L);
  const strip = L.map((x, i) => { const v = getAns(x), s2 = v == null ? '' : (v === x.a ? 'ok' : 'bad');
    return `<button data-act="jump" data-i="${i}" data-st="${s2}" aria-label="سؤال ${i+1}" ${i === view.i ? 'aria-current="true"' : ''}>${i+1}</button>`; }).join('');
  const opts = q.o.map((o, i) => {
    let cls = '', tag = '';
    if(answered){ if(i === q.a){ cls = 'ok'; tag = 'الصحيح'; } else if(i === a){ cls = 'bad'; tag = 'اختيارك'; } else cls = 'dim'; }
    return `<li><button class="opt ${cls}" data-act="pick" data-i="${i}" ${answered ? 'disabled' : ''}><span class="k">${LET[i]}</span><span class="t">${o}</span>${tag ? `<span class="tag" dir="rtl">${tag}</span>` : ''}</button></li>`;
  }).join('');
  const result = answered ? `<div class="result" id="result" aria-live="polite">
      ${a === q.a ? `<div class="verdict ok">${ICON.ok}إجابة صحيحة</div>` : `<div class="verdict bad">${ICON.bad}إجابة خاطئة، الصحيح <span class="en">${LET[q.a]}</span></div>`}
      <div class="exp"><b>الشرح:</b> ${q.e}</div>
      <button class="again" data-act="retry">جاوب السؤال من جديد</button></div>` : '';
  const confirm = view.confirm ? `<div class="confirm">بيمسح كل إجاباتك في ${title}. متأكد؟
      <div class="row"><button class="btn" data-act="reset-yes" style="border-color:var(--bad);color:var(--bad)">نعم، امسحها</button><button class="btn" data-act="reset-no">إلغاء</button></div></div>` : '';
  app.innerHTML = `
  <header class="bar"><div class="bar-in wrap">
    <button class="icon-btn" data-act="home" aria-label="رجوع للنماذج">${ICON.back}</button>
    <div><h1>${title}</h1><div class="sub num">سؤال ${ad(view.i+1)} من ${ad(total)} · ${ad(st.ok)} صح</div></div>
    ${saveTag()}</div>
    <div class="qprog"><span style="width:${total ? st.done/total*100 : 0}%"></span></div></header>
  <main class="wrap" id="qmain">
    <nav class="strip" id="strip" dir="ltr" aria-label="الأسئلة">${strip}</nav>
    ${confirm}
    <article class="card" id="card">
      ${view.kind === 'review' ? `<div class="src">من النموذج ${ad(q.n)}</div>` : ''}
      <div class="stem" lang="en">${q.s || '&nbsp;'}</div>
      <ol class="opts" lang="en">${opts}</ol>
      ${result}
    </article>
    <div class="keys"><span><kbd>1</kbd>–<kbd>4</kbd> أو <kbd>A</kbd>–<kbd>D</kbd> للإجابة</span><span><kbd>Enter</kbd> أو <kbd>←</kbd> التالي</span><span><kbd>→</kbd> السابق</span><span><kbd>R</kbd> إعادة السؤال</span><span><kbd>Esc</kbd> النماذج</span></div>
    <div class="swipe">اسحب يسار للسؤال التالي، ويمين للسابق</div>
    ${view.kind === 'model' && !view.confirm ? `<button class="reset" data-act="reset">امسح إجابات هذا النموذج</button>` : ''}
  </main>
  <div class="dock"><div class="dock-in wrap">
    <button class="btn" data-act="prev" ${view.i === 0 ? 'disabled' : ''}>السابق</button>
    <button class="btn primary" data-act="next">${view.i === total - 1 ? 'إنهاء' : 'التالي'}</button>
  </div></div>`;
  const c = document.querySelector('#strip [aria-current="true"]');
  if(c){ const s = document.getElementById('strip'); s.scrollLeft = c.offsetLeft - s.clientWidth/2 + c.clientWidth/2; }
}
function renderSummary(){
  const L = view.list, s = stats(L), wrong = mistakes(L);
  const next = view.kind === 'model' && BYN[view.n + 1] ? view.n + 1 : null;
  const title = view.kind === 'model' ? `النموذج ${ad(view.n)}` : 'مراجعة الأخطاء';
  app.innerHTML = `
  <header class="bar"><div class="bar-in wrap"><button class="icon-btn" data-act="home" aria-label="رجوع للنماذج">${ICON.back}</button>
    <div><h1>${title}</h1><div class="sub">النتيجة</div></div>${saveTag()}</div></header>
  <main class="wrap"><section class="card summary">
    <div class="big num">${s.ok} / ${s.total}</div>
    <div>${s.done < s.total ? `جاوبت ${ad(s.done)} من ${ad(s.total)}، والباقي بدون إجابة.` : (view.kind === 'model' ? 'خلصت النموذج.' : 'خلصت المراجعة.')} ${wrong.length ? `عندك ${ad(wrong.length)} ${wrong.length === 1 ? 'خطأ' : 'أخطاء'}.` : 'ولا خطأ، ممتاز.'}</div>
    ${track(s)}
    <div class="acts">
      ${wrong.length ? `<button class="btn primary" data-act="review-here">راجع الأخطاء</button>` : ''}
      ${next ? `<button class="btn ${wrong.length ? '' : 'primary'}" data-act="open" data-n="${next}">النموذج ${ad(next)}</button>` : ''}
      <button class="btn" data-act="jump" data-i="0">ارجع لأول سؤال</button>
      <button class="btn" data-act="home">كل النماذج</button>
    </div></section></main>`;
}

function render(){ view.name === 'home' ? renderHome() : renderQuiz(); }
function toTop(){ window.scrollTo(0, 0); }
function openList(kind, list, n, i){ view = {name:'quiz', kind, list, n, i: i || 0}; render(); toTop(); }
function go(i){
  if(view.name !== 'quiz') return;
  view.i = Math.max(0, Math.min(view.list.length, i)); view.confirm = false;
  if(view.kind === 'model' && view.i < view.list.length && (S.pos[view.n] || 0) !== view.i){ S.pos[view.n] = view.i; save(view.n); }
  render(); toTop();
}
function pick(i){
  const q = cur(); if(!q || getAns(q) != null || i >= q.o.length) return;
  (S.ans[q.n] = S.ans[q.n] || {})[q.k] = i; save(q.n);
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  render();
  const r = document.getElementById('result');
  if(r){ const rect = r.getBoundingClientRect(); if(rect.bottom > window.innerHeight - 90) r.scrollIntoView({behavior:'smooth', block:'center'}); }
}
function retry(){ const q = cur(); if(q && S.ans[q.n]){ delete S.ans[q.n][q.k]; save(q.n); render(); } }
function home(){ view = {name:'home'}; render(); toTop(); }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act === 'open') openList('model', BYN[+b.dataset.n].q, +b.dataset.n, 0);
  else if(act === 'resume'){ const n = +b.dataset.n; openList('model', BYN[n].q, n, Math.min(S.pos[n] || 0, BYN[n].q.length - 1)); }
  else if(act === 'review'){ const l = mistakes(); if(l.length) openList('review', l); }
  else if(act === 'review-here'){ const l = mistakes(view.list); if(l.length) openList('review', l); }
  else if(act === 'home') home();
  else if(act === 'pick') pick(+b.dataset.i);
  else if(act === 'retry') retry();
  else if(act === 'next') go(view.i + 1);
  else if(act === 'prev') go(view.i - 1);
  else if(act === 'jump') go(+b.dataset.i);
  else if(act === 'reset'){ view.confirm = true; render(); toTop(); }
  else if(act === 'reset-no'){ view.confirm = false; render(); }
  else if(act === 'reset-yes'){ S.ans[view.n] = {}; S.pos[view.n] = 0; save(view.n); view.confirm = false; view.i = 0; render(); toTop(); }
});

/* keyboard: works when the quiz or the page around it has focus */
function onKey(e){
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  const k = e.key;
  if(view.name !== 'quiz'){ return; }
  if(k === 'Escape'){ home(); e.preventDefault(); return; }
  if(view.i >= view.list.length){ if(k === 'ArrowRight'){ go(view.i - 1); e.preventDefault(); } return; }
  let idx = '1234'.indexOf(k); if(idx < 0) idx = '١٢٣٤'.indexOf(k); if(idx < 0 && /^[a-dA-D]$/.test(k)) idx = 'abcd'.indexOf(k.toLowerCase());
  if(idx >= 0){ pick(idx); e.preventDefault(); return; }
  if(k === 'r' || k === 'R'){ retry(); e.preventDefault(); return; }
  if(k === 'ArrowLeft' || (k === 'Enter' && !(e.target && e.target.closest && e.target.closest('button')))){ go(view.i + 1); e.preventDefault(); }
  else if(k === 'ArrowRight'){ go(view.i - 1); e.preventDefault(); }
}
document.addEventListener('keydown', onKey);
try{ if(window.parent && window.parent !== window) window.parent.document.addEventListener('keydown', onKey); }catch(e){}

/* touch: swipe left = next, swipe right = previous */
let sx = 0, sy = 0, st0 = 0;
document.addEventListener('touchstart', e => { if(e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st0 = Date.now(); }, {passive:true});
document.addEventListener('touchend', e => {
  if(view.name !== 'quiz' || !st0) return;
  if(e.target.closest && e.target.closest('#strip')) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st0; st0 = 0;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && dt < 700){ go(view.i + (dx < 0 ? 1 : -1)); }
}, {passive:true});

/* inside Streamlit: make the frame fill the screen so the bars stay in place */
function fitFrame(){
  try{
    const f = window.frameElement; if(!f) return;
    const pw = window.parent, top = Math.max(0, f.getBoundingClientRect().top);
    const h = Math.max(420, Math.floor(pw.innerHeight - top));
    if(Math.abs(f.offsetHeight - h) > 1){ f.style.height = h + 'px'; f.setAttribute('height', h); }
  }catch(e){}
}
fitFrame(); setTimeout(fitFrame, 150); setTimeout(fitFrame, 800);
try{ window.parent.addEventListener('resize', fitFrame); }catch(e){}
window.addEventListener('resize', fitFrame);

save(); render();
try{ window.focus(); }catch(e){}
})();
</script>
</body>
</html>
